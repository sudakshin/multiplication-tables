<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Multiplication Practice</title>
		<link
			rel="stylesheet"
			href="styles.css"
		/>
	</head>
	<body>
		<div class="container">
			<h1>Multiplication Tables</h1>

			<div id="range-buttons">
				<button id="range-11-20">Tables 11-20</button>
				<button id="range-2-20">Tables 2-20</button>
				<button id="range-21-30">Tables 21-30</button>
				<button id="range-2-30">Tables 2-30</button>
			</div>

			<!-- Toggle Button -->
			<button id="drawer-toggle">▼ Show Table Buttons</button>

			<!-- Drawer -->
			<div
				id="table-drawer"
				class="collapsed"
			>
				<div id="table-buttons"></div>
			</div>

			<div id="question"></div>
			<input
				type="number"
				id="answer"
				autofocus
			/>
			<br />
			<button id="submit">Submit</button>
			<div id="feedback"></div>
			<div
				class="tooltip"
				id="tooltip"
			></div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
